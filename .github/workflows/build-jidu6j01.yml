name: Build JIDU 6J01 OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: https://github.com/sh3ikh-faisal/openwrt.git
  BRANCH: openwrt-25.12

jobs:
  build:
    name: Build JIDU 6J01
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Clone EXACTLY sh3ikh-faisal/openwrt
      # ---------------------------------------------------------
      - name: Clone sh3ikh-faisal OpenWrt fork
        run: |
          git clone \
            --branch "${BRANCH}" \
            --single-branch \
            --depth=1 \
            "${REPO}" \
            openwrt

          cd openwrt

          echo "Repository:"
          git remote -v

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

          echo "Commit information:"
          git log -1 --format='%H%n%ad%n%s' --date=iso

      # ---------------------------------------------------------
      # 2. Install build dependencies
      # ---------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            xsltproc \
            swig \
            ccache \
            device-tree-compiler

      # ---------------------------------------------------------
      # 3. Update/install feeds
      # ---------------------------------------------------------
      - name: Update OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------------
      # 4. Create JIDU 6J01 configuration
      # ---------------------------------------------------------
      - name: Configure JIDU 6J01
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          #
          # Target
          #

          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y

          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jiorouter_ax6000_jidu6j01=y

          #
          # Requested packages
          #

          CONFIG_PACKAGE_bridger=y
          CONFIG_PACKAGE_kmod-macvlan=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_iperf3=y

          EOF

          make defconfig

      # ---------------------------------------------------------
      # 5. Verify target and packages
      # ---------------------------------------------------------
      - name: Verify configuration
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "SOURCE"
          echo "========================================"

          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config | \
            grep -E 'mediatek|filogic|jiorouter' || true

          echo
          echo "========================================"
          echo "PACKAGES"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(bridger|kmod-macvlan|mwan3|luci-app-mwan3|htop|nano|iperf3)=' \
            .config || true

          echo
          echo "========================================"
          echo "DEVICE PROFILE CHECK"
          echo "========================================"

          grep \
            'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jiorouter_ax6000_jidu6j01=y' \
            .config

      # ---------------------------------------------------------
      # 6. Download package sources
      # ---------------------------------------------------------
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      # ---------------------------------------------------------
      # 7. Build
      # ---------------------------------------------------------
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      # ---------------------------------------------------------
      # 8. Display generated images
      # ---------------------------------------------------------
      - name: Find JIDU firmware
        working-directory: openwrt
        run: |
          echo "Generated JIDU images:"
          find bin/targets/mediatek/filogic \
            -type f \
            -iname '*jidu*' \
            -print

      # ---------------------------------------------------------
      # 9. Verify packages in firmware manifest
      # ---------------------------------------------------------
      - name: Verify packages in firmware
        working-directory: openwrt
        run: |

          echo "Firmware manifests:"
          find bin/targets/mediatek/filogic \
            -type f \
            -name '*.manifest' \
            -print

          echo
          echo "Requested packages found in manifest:"
          grep -E \
            'bridger|kmod-macvlan|mwan3|luci-app-mwan3|htop|nano|iperf3' \
            bin/targets/mediatek/filogic/*.manifest || true

      # ---------------------------------------------------------
      # 10. Generate SHA256 checksums
      # ---------------------------------------------------------
      - name: Generate checksums
        working-directory: openwrt
        run: |

          cd bin/targets/mediatek/filogic

          sha256sum \
            *jidu6j01* \
            > jidu6j01-sha256sums.txt

          echo
          cat jidu6j01-sha256sums.txt

      # ---------------------------------------------------------
      # 11. Save build information
      # ---------------------------------------------------------
      - name: Save build information
        working-directory: openwrt
        run: |

          mkdir -p ../build-info

          git remote -v > ../build-info/source.txt

          echo "Branch:" >> ../build-info/source.txt
          git branch --show-current >> ../build-info/source.txt

          echo "Commit:" >> ../build-info/source.txt
          git rev-parse HEAD >> ../build-info/source.txt

          echo "Commit details:" >> ../build-info/source.txt
          git log -1 --format='%H%n%ad%n%s' --date=iso \
            >> ../build-info/source.txt

          echo "Configuration:" \
            > ../build-info/config.txt

          grep -E \
            '^CONFIG_TARGET_|^CONFIG_PACKAGE_(bridger|kmod-macvlan|mwan3|luci-app-mwan3|htop|nano|iperf3)=' \
            .config \
            >> ../build-info/config.txt

          cp bin/targets/mediatek/filogic/jidu6j01-sha256sums.txt \
            ../build-info/

      # ---------------------------------------------------------
      # 12. Upload firmware
      # ---------------------------------------------------------
      - name: Upload JIDU 6J01 firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jidu6j01-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*jidu6j01*
            openwrt/bin/targets/mediatek/filogic/*jidu*sysupgrade*
            openwrt/bin/targets/mediatek/filogic/*jidu*initramfs*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/jidu6j01-sha256sums.txt
            build-info/
          if-no-files-found: error
          retention-days: 30
