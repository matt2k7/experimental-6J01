name: Build OpenWrt for JioRouter AX6000 JIDU6J01

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean

      - name: Checkout OpenWrt Fork
        uses: actions/checkout@v4
        with:
          repository: sh3ikh-faisal/openwrt
          ref: openwrt-25.12
          fetch-depth: 0

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y
          
          # Web Interface
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          
          # Custom Packages
          CONFIG_PACKAGE_bridger=y
          CONFIG_PACKAGE_kmod-macvlan=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_iperf3=y
          EOF
          
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8

      - name: Create Swap Space
        run: |
          sudo fallocate -l 8G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      # =========================================================
      # Save exact build information
      # =========================================================
      - name: Save build information
        run: |
          set -e
          mkdir -p build-info

          {
            echo "Repository:"
            git remote get-url origin
            echo
            echo "Branch:"
            git branch --show-current
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Commit details:"
            git log -1 --format='%H%n%ad%n%s' --date=iso
          } > build-info/source.txt

          echo "Requested packages:" > build-info/packages.txt
          grep -E '^CONFIG_PACKAGE_(luci|luci-ssl|bridger|kmod-macvlan|mwan3|luci-app-mwan3|htop|nano|iperf3)=y' .config >> build-info/packages.txt

          cp bin/targets/mediatek/filogic/*sha256sums* build-info/ || true

      # =========================================================
      # Upload firmware artifact
      # =========================================================
      - name: Upload JIDU 6J01 firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jidu6j01-${{ github.run_number }}
          path: |
            bin/targets/mediatek/filogic/*jidu*
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/*.json
            bin/targets/mediatek/filogic/*sha256sums*
            build-info/
          if-no-files-found: error
          retention-days: 30
