name: Build OpenWrt for JioRouter AX6000 JIDU6J01

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Compile OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          # OpenWrt builds require significant space; remove unused runner directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean

      - name: Checkout OpenWrt Fork
        uses: actions/checkout@v4
        with:
          repository: sh3ikh-faisal/openwrt
          ref: openwrt-25.12
          fetch-depth: 0

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y
          
          # Custom Packages
          CONFIG_PACKAGE_bridger=y
          CONFIG_PACKAGE_kmod-macvlan=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_iperf3=y
          EOF
          
          # Expand the configuration to resolve all dependencies
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8

      - name: Compile Firmware
        run: |
          # Use all available cores. If it fails, fallback to single-core verbose output for debugging
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jidu6j01-firmware
          path: bin/targets/mediatek/filogic/
      # 13. Save exact build information
      # =========================================================
      - name: Save build information
        working-directory: openwrt
        run: |
          set -e

          mkdir -p ../build-info

          {
            echo "Repository:"
            git remote get-url origin

            echo
            echo "Branch:"
            git branch --show-current

            echo
            echo "Commit:"
            git rev-parse HEAD

            echo
            echo "Commit details:"
            git log -1 --format='%H%n%ad%n%s' --date=iso

            echo
            echo "JIDU profile:"
            echo "${JIDU_PROFILE}"

          } > ../build-info/source.txt

          echo "Requested packages:" \
            > ../build-info/packages.txt

          grep -E \
            '^CONFIG_PACKAGE_(bridger|kmod-macvlan|mwan3|luci-app-mwan3|htop|nano|iperf3)=y' \
            .config \
            >> ../build-info/packages.txt

          cp \
            bin/targets/mediatek/filogic/jidu6j01-sha256sums.txt \
            ../build-info/

      # =========================================================
      # 14. Upload firmware artifact
      # =========================================================
      - name: Upload JIDU 6J01 firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jidu6j01-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*jidu*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/*.json
            openwrt/bin/targets/mediatek/filogic/jidu6j01-sha256sums.txt
            build-info/
          if-no-files-found: error
          retention-days: 30
